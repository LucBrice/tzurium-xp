name: EBTA engine CI

# CI autonome de la source canonique publique TZURIUM XP (noyau ebta_engine,
# enveloppe "code seulement"). Distincte de la CI du depot prive : n'installe pas
# numpy/pandas (le noyau publie n'en importe aucun, ebta_private n'existe
# pas ici), ne valide aucun checkpoint.json/tracking.json (absents ici),
# et ajoute le declencheur pull_request (CA-019) absent de la CI privee.

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install Pyrefly (CI tooling only, not a runtime dependency)
        run: python -m pip install pyrefly==1.1.1

      - name: Install Ruff (CI tooling only, not a runtime dependency)
        run: python -m pip install ruff==0.16.2

      - name: Build and install the public distribution
        run: |
          python -m pip wheel --no-deps --wheel-dir dist .
          python -m pip install --force-reinstall dist/*.whl

      - name: Verify the installed package outside the checkout
        run: |
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/tests/test_installed_package.py" --forbid-root "$GITHUB_WORKSPACE"

      - name: Run Pyrefly checks
        run: python -m pyrefly check Implementation/ebta_engine --output-format min-text

      - name: Run Ruff checks
        run: python -m ruff check Implementation/ebta_engine

      - name: Run the ebta_engine test suite
        run: python -m unittest discover -s Implementation/ebta_engine/tests -t Implementation
