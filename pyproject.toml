[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tzurium-xp-ebta-engine"
version = "0.0.0"
description = "Public, standard-library EBTA validation and research engine"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]

[project.optional-dependencies]
# CI tooling only, not a runtime dependency of ebta_engine (stdlib-only
# core, see CLAUDE.md "What this repo is"): required to run
# verification/verify_local.py, which validates checkpoint.json/
# tracking.json against their JSON Schemas. Install with
# `pip install .[verify]`. Same pinned version already authorized as CI
# tooling on the private repository (.github/workflows/ebta-runtime-suite.yml).
verify = ["jsonschema==4.23.0"]

[tool.setuptools]
package-dir = {"" = "Implementation"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["Implementation"]
include = ["ebta_engine*"]

[tool.setuptools.package-data]
ebta_engine = [
    "governance/*.json",
    "schemas/*.json",
    "fixtures/invalid_invariants/*.json",
    "fixtures/invalid_missing_required/*.json",
    "fixtures/invalid_rejection_tests/*.json",
    "fixtures/invalid_rejection_tests/*.jsonl",
    "fixtures/valid_minimal/*.json",
    "fixtures/valid_minimal/*.jsonl",
    "fixtures/valid_minimal/reports/*.json",
    "fixtures/valid_minimal/series/*.json",
]

[tool.pyrefly]
search-path = ['Implementation']

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["F", "E9", "B", "PLE", "RUF"]
